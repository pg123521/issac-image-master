name: IsaacItemLens
options:
  bundleIdPrefix: com.pg123521
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
targets:
  IsaacItemLens:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Resources
      - path: App/Resources/objects.json
        buildPhase: resources
      - path: App/Resources/item-vectors.f16
        buildPhase: resources
      - path: App/Resources/item-vectors.json
        buildPhase: resources
      - path: App/Resources/items
        type: folder
        buildPhase: resources
      - path: App/Resources/objects
        type: folder
        buildPhase: resources
      - path: ../ModelConversion/output/RoomCollectibleDetector.mlpackage
        buildPhase: resources
      - path: ../ModelConversion/output/MobileCLIPImageEncoderRaw.mlpackage
        buildPhase: resources
    settings:
      base:
        CURRENT_PROJECT_VERSION: 7
        MARKETING_VERSION: 0.6.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.panmingyang.isaacitemlens.dev2026
        PRODUCT_NAME: Isaac Item Lens
        INFOPLIST_KEY_CFBundleDisplayName: Isaac Item Lens
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
